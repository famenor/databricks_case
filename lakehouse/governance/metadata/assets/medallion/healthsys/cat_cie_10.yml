name: cat_cie_10
layers:
  raw:
    write_mode: overwrite_partition
    version: 1
    description: Catalog of CIE codes as in the original source in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      cie_code:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'CIE Code'
      cie_name:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'CIE Name'
  audit:
    write_mode: merge_snapshot
    version: 1
    description: Catalog of CIE codes audited and consolidated in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      cie_id:
        rename_from: cie_code
        validations:
          - validation: not_null
          - validation: unique
            unique_group: 1
      cie_name:
        validations:
          - validation: not_null