name: certificates
layers:
  raw:
    write_mode: overwrite_partition
    version: 1
    description: Customer data and their certificate numbers in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      id:
        data_type: integer
        is_nullable: False
        is_partition: False
        comment: 'Bussiness identifier of the customer'
      nombre:
        data_type: string
        is_nullable: False
        is_partition: False
        is_pii: True
        comment: 'Name of the customer'
      email:
        data_type: string
        is_nullable: False
        is_partition: False
        is_pii: True
        comment: 'Email of the customer'
      edad:
        data_type: integer
        is_nullable: False
        is_partition: False
        comment: 'Age of the customer'
      fecha_nacimiento:
        data_type: timestamp
        is_nullable: False
        is_partition: False
        comment: 'Date of birth of the customer'
      ciudad:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: City where the customer lives'
      numero_certificado:
        data_type: integer
        is_nullable: False
        is_partition: False
        comment: 'Certificate number of the customer'
      sexo:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Gender of the customer'
  audit:
    write_mode: merge_snapshot
    version: 1
    description: Customer data and their certificate numbers audited and consolidated in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      certificate_id:
        rename_from: id
        validations:
          - validation: is_not_null
          - validation: is_unique
            unique_group: 1
      name:
        rename_from: nombre
        data_type: string
        validations:
          - validation: is_not_null
      email:
        data_type: string
        validations:
          - validation: is_not_null
      age:
        rename_from: edad
        data_type: integer
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: 0
            max_allowed: 100
      birth_date:
        rename_from: fecha_nacimiento
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: '1925-01-01'
            max_allowed: '2024-12-31'
      city:
        rename_from: ciudad
        validations:
          - validation: is_not_null
      certificate_number:
        rename_from: numero_certificado
        validations:
          - validation: is_not_null
          - validation: is_unique
            unique_group: 2
      gender:
        rename_from: sexo
        validations:
          - validation: is_not_null
          - validation: is_in_list
            allowed: 'M,F'