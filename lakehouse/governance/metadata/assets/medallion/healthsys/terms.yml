name: terms
layers:
  - layer: raw
    write_mode: overwrite_partition
    version: 1
    description: Dates when the certificate was valid in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      - column: id
        data_type: integer
        is_nullable: False
        is_partition: False
        comment: 'Business identifier of the term'
      - column: certificate_number
        data_type: integer
        is_nullable: False
        is_partition: False
        comment: 'Certificate number'
      - column: fecha_inicio_vigencia
        data_type: timestamp
        is_nullable: False
        is_partition: False
        comment: 'Date when the term started'
      - column: fecha_fin_periodo
        data_type: timestamp
        is_nullable: False
        is_partition: False
        comment: 'Date when the term finished'
