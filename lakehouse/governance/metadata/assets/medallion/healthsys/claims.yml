name: claims
layers:
  raw:
    write_mode: overwrite_partition
    version: 1
    description: Claims made by the customers in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      SINIESTRO:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Business identifier of the claim'
      STATE:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'State where the claim was made'
      CIE10:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'CIE code of the related pathology'
      DIAGNOSIS:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Diagnosis associated with the CIE code'
      FECHA_OCURRIDO:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Date when the claim occurred'
      FECHA_PAGO:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Date when the payment was made'
      FECHA_PRIMERGASTO:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Date when the first expense was made'
      OCURRIDO:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Unknown quantity in Spain format'
      PAGOS:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Amount paid in Spain format'
      COASEGURO:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Consurance in Spain format'
      IVAREC:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'IVA in Spain format'
      DEDUCIBLE:
        data_type: string
        is_nullable: True
        is_partition: False
        comment: 'Deductible in Spain format'
      CAUSA:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Reason of the claim'
      CVE_MES:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Year and month of the claim'
      MES_CONT:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Last day of the related month'
      TIPO_PAGO:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Type of payment'
      CLASF_PROV:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Provider'
      NumCertificado:
        data_type: string
        is_nullable: False
        is_partition: False
        comment: 'Certificate of the customer who made the claim'
  audit:
    write_mode: merge_incremental
    version: 1
    description: Claims made by the customers audited and consolidated in delta format
    owner: armando.n90@gmail.com
    retention_policy: permanent
    schema:
      claim_id:
        rename_from: SINIESTRO
        validations:
          - validation: is_not_null
          - validation: unique
            unique_group: 1
      state:
        rename_from: STATE
        validations:
          - validation: is_not_null
      cie_id:
        rename_from: CIE10
        validations:
          - validation: is_not_null
          - validation: is_in_list
            reference: cie_id
            table: audit_cat_cie_10
            schema: bronze_healthsys
      diagnosis:
        rename_from: DIAGNOSIS 
        validations:
          - validation: is_not_null
      incident_date:
        rename_from: FECHA_OCURRIDO
        data_type: timestamp
        validations:
          - validation: is_not_null
          - validation: is_date_format
            format: '%d/%m/%Y'
          - validation: is_in_bounds
            min_allowed: '2020-01-01'
            max_allowed: '2030-12-31'
      payment_date:
        rename_from: FECHA_PAGO
        data_type: timestamp
        validations:
          - validation: is_date_format
            format: '%d/%m/%Y'
          - validation: is_in_bounds
            min_allowed: '2020-01-01'
            max_allowed: '2030-12-31'
          - validation: is_not_lower_than
            reference: first_expense_date
      first_expense_date:
        rename_from: FECHA_PRIMERGASTO
        data_type: timestamp
        validations:
          - validation: is_date_format
            format: '%d/%m/%Y'
          - validation: is_in_bounds
            min_allowed: '2020-01-01'
            max_allowed: '2030-12-31'
          - validation: is_not_lower_than
            reference: incident_date
      ocurrido:
        rename_from: OCURRIDO
        data_type: float
        validations:
          - validation: is_in_bounds
            min_allowed: -1000000
            max_allowed: 10000000
      payments:
        rename_from: PAGOS
        data_type: float
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: 0
            max_allowed: 10000000
      coinsuranse:
        rename_from: COASEGURO
        data_type: float
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: 0
            max_allowed: 10000000
      ivarec:
        rename_from: IVAREC
        data_type: float
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: 0
            max_allowed: 10000000
      deductible:
        rename_from: DEDUCIBLE
        data_type: float
        validations:
          - validation: is_not_null
          - validation: is_in_bounds
            min_allowed: 0
            max_allowed: 10000000
      incident_reason:
        rename_from: CAUSA 
        validations:
          - validation: is_not_null
          - validation: is_in_list
            allowed: 'Enfermedad,Accidente'
      cve_mes:
        rename_from: CVE_MES
        validations:
          - validation: is_not_null
      month_cont_date:
        rename_from: MES_CONT
        data_type: timestamp
        validations:
          - validation: is_not_null
          - validation: is_date_format
            format: '%d/%m/%Y'
          - validation: is_in_bounds
            min_allowed: '2020-01-01'
            max_allowed: '2030-12-31'
          - validation: is_not_lower_than
            reference: payment_date
      payment_type:
        rename_from: TIPO_PAGO
        validations:
          - validation: is_not_null
          - validation: is_in_list
            allowed: 'Pago Directo'
      provider:
        rename_from: CLASF_PROV 
        validations:
          - validation: is_not_null
      certificate_number:
        rename_from: NumCertificado
        data_type: integer
        validations:
          - validation: is_not_null
          - validation: is_in_list
            reference: certificate_id
            table: audit_certificates
            schema: bronze_healthsys